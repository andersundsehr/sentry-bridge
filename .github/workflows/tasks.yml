name: Tasks

on:
  push:
  pull_request:

jobs:
  lint-php:
    name: "linting:    php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        typo3: [ '12', '13', '14' ]
        exclude:
          # TYPO3 v14 requires PHP >= 8.3
          - php: '8.2'
            typo3: '14'
    env:
      COMPOSER_AUTH: ${{ secrets.TYPO3_ELTS_COMPOSER_AUTH }}
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - name: Install the security-fixed SVG sanitizer in CI
        run: |
          alias=0.22.99
          if [ "${{ matrix.typo3 }}" = "11" ]; then alias=0.18.99; fi
          composer require "enshrined/svg-sanitize:1.0.0 as $alias" --dev --no-update --sort-packages --no-interaction
      - name: Configure TYPO3 ELTS when an authorized test license is available
        if: (matrix.typo3 == '11' || matrix.typo3 == '12') && vars.TYPO3_ELTS_REPOSITORY_URL != ''
        env:
          TYPO3_ELTS_REPOSITORY_URL: ${{ vars.TYPO3_ELTS_REPOSITORY_URL }}
        run: composer config --global repositories.typo3-elts composer "$TYPO3_ELTS_REPOSITORY_URL"
      - run: composer require typo3/minimal="^${{ matrix.typo3 }}" --sort-packages --no-scripts -W --dev
      - run: composer check-platform-reqs
      - run: composer audit --abandoned=report
      - run: composer run-script post-autoload-dump
      - run: bash tests/typo3-svg-sanitizer.sh
      - run: ln -sfn phpstan-baseline-${{ matrix.typo3 }}.neon phpstan-baseline.neon
      - name: Run all static checks
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/grumphp run --no-ansi 2>&1 | tee /tmp/php85-grumphp.log
      - name: Report failed static checks
        if: failure()
        run: |
          if [ -f /tmp/php85-grumphp.log ]; then
            php -r '$s=file_get_contents("/tmp/php85-grumphp.log"); echo "::error::".str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr($s, -5000))."\n";'
          fi
      - name: Run the HTTP and CLI integration tests
        shell: bash
        run: |
          set -o pipefail
          composer run-test-server > /tmp/php85-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://localhost:1180/; then break; fi
            sleep 1
          done
          curl --silent --output /dev/null http://localhost:1180/
          composer test 2>&1 | tee /tmp/php85-tests.log
      - name: Report integration test failure
        if: failure()
        run: |
          python3 -c 'import pathlib; s="\n".join(p.read_text() for p in [pathlib.Path("/tmp/php85-tests.log"), pathlib.Path("/tmp/php85-server.log")] if p.exists())[-5000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
