name: Tasks

on:
  push:
  pull_request:

jobs:
  lint-php:
    name: "linting:    php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        typo3: [ '12', '13', '14' ]
        exclude:
          # TYPO3 v14 requires PHP >= 8.3
          - php: '8.2'
            typo3: '14'
    env:
      # pluswerk/grumphp-config runs its own `composer update` (without our flags) to install TYPO3 related packages.
      # phpro/grumphp does not allow PHP 8.6 yet, so ignore the upper PHP bound there as well.
      COMPOSER_IGNORE_PLATFORM_REQ: 'php+'
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - run: composer require typo3/minimal="^${{ matrix.typo3 }}" --dev --ignore-platform-req=php+
      # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. phpro/grumphp)
      - if: matrix.php == '8.6'
        run: composer check-platform-reqs --no-dev
      - run: ./vendor/bin/grumphp run --ansi
      - run: composer run-test-server &
      - run: composer test
